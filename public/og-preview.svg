<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Dark Gradient Background -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <circle cx="200" cy="150" r="300" fill="url(#glow-grad)" />
  <circle cx="1000" cy="480" r="260" fill="url(#glow-grad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="160" y1="0" x2="160" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="320" y1="0" x2="320" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="560" y1="0" x2="560" y2="630" />
    <line x1="640" y1="0" x2="640" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="880" y1="0" x2="880" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1040" y1="0" x2="1040" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(100, 110)">
    <rect width="280" height="38" rx="19" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">DISTRIBUTED SYSTEMS LAB</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="210" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    System Design Playground
  </text>
  <text x="100" y="265" fill="url(#text-grad)" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">
    Interactive Architecture &amp; Chaos Simulator
  </text>
  <text x="100" y="320" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
    Model microservices, simulate live traffic loads with WebAssembly queueing theory,
  </text>
  <text x="100" y="352" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">
    and inject chaos latency spikes to uncover production bottlenecks in real-time.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect width="210" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="24" y="32" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">⚡ 10 Hz WASM Engine</text>

    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="220" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <text x="24" y="32" fill="#f43f5e" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">🔥 Chaos Resilience</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect width="220" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <text x="24" y="32" fill="#a855f7" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">👥 Real-Time Yjs Collab</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(710, 0)">
      <rect width="230" height="52" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <text x="24" y="32" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">💰 Live AWS Cost Audit</text>
    </g>
  </g>

  <!-- URL Tag -->
  <text x="100" y="555" fill="#64748b" font-family="Fira Code, monospace" font-size="18" font-weight="500">
    https://systemdesignplayground.com
  </text>
</svg>
